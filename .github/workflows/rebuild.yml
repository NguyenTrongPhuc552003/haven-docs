# Rebuild the production site on Vercel every night, so pages copied from
# the haven, elmos and kdal repositories (README, records, changelog, ELMOS
# and KDAL docs) follow those repositories without a push here.
#
# Needs the repository secret VERCEL_DEPLOY_HOOK: the URL of a deploy hook
# for branch main (Vercel: project haven-docs > Settings > Git > Deploy
# Hooks). Without it the job only prints a notice.
name: rebuild

on:
  schedule:
    - cron: "41 20 * * *" # 03:41 in Vietnam (UTC+7)
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK is not set; nothing to do."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" | head -c 300
